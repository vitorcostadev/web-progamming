<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progamação WEB M1 - Login</title>
    <script src="/js/index.js"></script>
</head>
<body>
    <h1> Progamação WEB - Login</h1>
    <form action="/login", method="post">
        <b>Username: </b>
        <input
        name="username",
        type="text",
        placeholder="Your email here"
        />
        <br>

        <b>Password: </b>
        <input
        name="password",
        type="password",
        placeholder="Your password here"
        />
        <br>
        
       <input name="connected", type="checkbox", value="1">
        Manter conectado
        <br><br>

        <input type="submit"/>

    </form>
</body>
</html>
