<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de obras do museu</title>
    <link rel="stylesheet" href="/style/style.css">
    <script src="/js/registerValidator.js" type="module"></script>
</head>
<body>
    <main>
        <h1>Cadastro de obras do museu</h1>

        <form id="museu-form" novalidate>
            <label for="work_name">Nome da obra:</label>
            <input
                type="text"
                name="work_name"
                id="work_name"
                class="itas-style"
                maxlength="100"
                required>

            <label for="actor">Nome do autor:</label>
            <input
                type="text"
                name="actor"
                id="actor"
                class="itas-style"
                maxlength="100"
                required>

            <label for="work_year">Ano da obra:</label>
            <input
                type="text"
                inputmode="numeric"
                name="work_year"
                id="work_year"
                class="itas-style"
                maxlength="4"
                required>

            <label for="period_work">Período da obra:</label>
            <select
                name="period_work"
                id="period_work"
                class="itas-style"
                required>
                <option value="">Escolha uma opção</option>
                <option value="d.C">d.C.</option>
                <option value="a.C">a.C.</option>
            </select>

            <label for="work_type">Tipo da obra:</label>
            <select
                name="work_type"
                id="work_type"
                class="itas-style"
                required>
                <option value="">Escolha uma opção</option>
                <option value="quadro">Quadro</option>
                <option value="escultura">Escultura</option>
                <option value="outro">Outro</option>
            </select>

            <label for="details_text">Detalhamento (opcional):</label>
            <textarea
                id="details_text"
                name="details"
                rows="5"
                maxlength="2000"
                class="itas-style"></textarea>

            <button type="submit" class="itas-style">Cadastrar</button>
        </form>

        <section>
            <h2 id="works-title">Obras cadastradas</h2>
            <table id="works-table">
                <caption>Selecione uma obra para ver seu detalhamento.</caption>
                <thead>
                    <tr>
                        <th scope="col">Nome da obra</th>
                        <th scope="col">Autor</th>
                        <th scope="col">Ano</th>
                        <th scope="col">Período</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <dialog id="validator"></dialog>

    <dialog id="work-details-dialog">
        <h2 id="details-title">Detalhamento da obra</h2>
        <p id="work-details-content"></p>
        <form method="dialog">
            <button type="submit" class="itas-style">Fechar</button>
        </form>
    </dialog>
</body>
</html>
