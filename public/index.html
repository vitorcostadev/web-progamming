<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catalogus Operum Artis</title>
        <link rel="stylesheet" type="text/css" href="tema.css"/>
    </head>
    <body>
        <header>
            <h1>Catalogus Operum Artis</h1>
        </header>
        <main>
            <div>
                <h2>I · Dados da obra</h2>
                <form id="formObra">
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" maxlength="100"/>
                    </p>
                    <p>
                        <label for="autor">Autor:</label>
                        <input type="text" id="autor" name="autor" maxlength="100"/>
                    </p>
                    <p>
                        <label for="ano">Ano da obra:</label>
                        <input type="text" id="ano" name="ano" maxlength="4"/>
                    </p>
                    <p>
                        <label for="periodo">Período:</label>
                        <select id="periodo" name="periodo">
                            <option value="">Selecione</option>
                            <option value="d.C.">d.C.</option>
                            <option value="a.C.">a.C.</option>
                        </select>
                    </p>
                    <p>
                        <label for="tipo">Tipo:</label>
                        <select id="tipo" name="tipo">
                            <option value="">Selecione...</option>
                            <option value="Quadro">Quadro</option>
                            <option value="Escultura">Escultura</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </p>
                    <p>
                        <label for="detalhamento">Detalhamento (opcional):</label>
                        <textarea id="detalhamento" name="detalhamento" maxlength="2000" rows="4"></textarea>
                    </p>

                    <ul id="mensagensErro"></ul>
                    <button type="submit">Registrar obra</button>
                </form>
            </div>
            <div>
                <h2>II · Obras Registradas</h2>
                <table id="tabelaObras">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Autor</th>
                            <th>Ano</th>
                            <th>Período</th>
                            <th>Tipo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <!-- Linhas injetadas dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
            <div id="painelDetalhes" style="margin-top: 20px; display: none;">
                <h3>Detalhes da Obra Selecionada</h3>
                <p id="detalhamentoSelecionado"></p>
            </div>
        </main>
        <footer>
            <p>Catalogus Operum Artis. Ad Astra Per Aspera.</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
